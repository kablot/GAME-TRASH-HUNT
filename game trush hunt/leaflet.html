<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaflet Marker Cluster Bali</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <!-- MarkerCluster CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    /* Custom marker bulat merah */
    .custom-marker {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #e53935;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      border: 3px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }

    /* Cluster style */
    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large {
      background: rgba(255, 87, 34, 0.25);
    }

    .marker-cluster-small div,
    .marker-cluster-medium div,
    .marker-cluster-large div {
      background: #e53935;
      color: white;
      font-weight: bold;
      border: 3px solid white;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <script>
    // Inisialisasi map
    const map = L.map("map").setView([-8.45, 115.10], 10);

    // Basemap
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    // Cluster group
    const markers = L.markerClusterGroup();

    // Custom icon function
    function createCustomIcon(emoji) {
      return L.divIcon({
        className: "",
        html: `<div class="custom-marker">${emoji}</div>`,
        iconSize: [38, 38],
        iconAnchor: [19, 19]
      });
    }

    // Data marker (contoh titik di Bali)
    const locations = [
      { name: "Buleleng", lat: -8.112, lng: 115.088, icon: "⛽" },
      { name: "Denpasar", lat: -8.670, lng: 115.212, icon: "🏢" },
      { name: "Kuta", lat: -8.722, lng: 115.172, icon: "🛍️" },
      { name: "Jimbaran", lat: -8.790, lng: 115.160, icon: "🍽️" },
      { name: "Ubud", lat: -8.506, lng: 115.262, icon: "🏨" },
      { name: "Sanur", lat: -8.693, lng: 115.263, icon: "🏖️" },
      { name: "Seminyak", lat: -8.690, lng: 115.165, icon: "☕" },
      { name: "Nusa Dua", lat: -8.809, lng: 115.228, icon: "🌙" },
      { name: "Tabanan", lat: -8.541, lng: 115.125, icon: "🏪" },
      { name: "Bangli", lat: -8.454, lng: 115.354, icon: "🏥" },
      { name: "Karangasem", lat: -8.446, lng: 115.617, icon: "🏫" },
      { name: "Gianyar", lat: -8.544, lng: 115.325, icon: "🏛️" }
    ];

    // Tambahkan marker ke cluster
    locations.forEach(loc => {
      const marker = L.marker([loc.lat, loc.lng], {
        icon: createCustomIcon(loc.icon)
      }).bindPopup(`<b>${loc.name}</b>`);
      
      markers.addLayer(marker);
    });

    // Tambahkan cluster ke map
    map.addLayer(markers);
  </script>

</body>
</html>
